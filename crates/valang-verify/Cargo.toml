[package]
name = "valang-verify"
description = "Verifying an execution record — the one implementation every server SDK binds to"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
valang-runtime = { path = "../valang-runtime" }
sha2 = "0.10"
ed25519-dalek = "2"
# A wallet whose identity key is on the Secure Enclave signs with P-256, and a
# verifier that only knew one curve could not read its records.
# Verification only — no default features, so nothing here reaches for a
# random number generator that a Wasm target has no answer for.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
valang.workspace = true
