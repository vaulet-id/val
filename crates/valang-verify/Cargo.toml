[package]
name = "valang-verify"
description = "Verifying an execution record — the one implementation every server SDK binds to"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
valang-runtime = { path = "../valang-runtime" }
sha2 = "0.10"
ed25519-dalek = "2"
# A wallet whose identity key is on the Secure Enclave signs with P-256, and a
# verifier that only knew one curve could not read its records.
p256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
valang.workspace = true
# A P-256 wallet, for the tests that are about one.
rand_core = { version = "0.6", features = ["getrandom"] }
