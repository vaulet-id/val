[package]
name = "valang-package"
description = "The .va package: sources, manifest, derived report, integrity and signature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
valang.workspace = true
valang-runtime = { path = "../valang-runtime" }
sha2 = "0.10"
# Signing is a specification and a security boundary. Both are reasons not to
# write one here.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
# `did:key` is base58btc over a multicodec prefix, and both are specifications.
# A publisher's identity resting on a hand-rolled alphabet is the wrong place to
# save a dependency.
bs58 = "0.5"

# A text bundle on disk is JSON, and JSON is a specification.
serde_json = "1"

# The report comes from the compiled module, so building a package and
# admitting one both need the back end.
valang-wasm = { path = "../valang-wasm" }

[dev-dependencies]
# The runtime, so one test can take a package from bytes all the way to a
# signed record — which is the only place the steps are proved to compose.
valang-runtime = { path = "../valang-runtime" }
