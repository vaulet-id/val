[package]
name = "valang-runtime"
description = "The VAL back end: the tree-walking evaluator, effect requests and execution records"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
valang.workspace = true
# Hashing is a specification and a security boundary; both are reasons not to
# write one here.
sha2 = "0.10"
# Reading the host fixture. JSON because a person edits it — in the playground's
# editor, in a diff, in a test — and a canonical binary encoding is for what is
# hashed rather than for what is typed.
serde_json = { version = "1", optional = true }
# The fixture signs for real, so that a verifier has something to verify. A
# stub that hashed instead would let every test pass against a check nobody ran.
ed25519-dalek = { version = "2", optional = true }

[features]
default = ["fixture"]
fixture = ["dep:serde_json", "dep:ed25519-dalek"]

[dev-dependencies]
sha2 = "0.10"
