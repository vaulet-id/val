[package]
# The language is VAL; the crate is `valang`, because `val` on crates.io belongs
# to somebody else. Named at the start rather than at the first publish, so no
# rename lands on people who already depend on it.
name = "valang"
description = "The VAL front end: parser, typed AST, type checking, capability and trust analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# A catalogue and a text bundle are both documents this crate reads, and JSON is
# a specification — hand-rolling one here produced a parser that consumed the
# object it was standing on.
serde_json = "1"

[features]
cli = []

[[bin]]
name = "valc"
required-features = ["cli"]
