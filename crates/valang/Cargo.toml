[package]
# The language is VAL; the crate is `valang`, because `val` on crates.io belongs
# to somebody else. Named at the start rather than at the first publish, so no
# rename lands on people who already depend on it.
name = "valang"
description = "The VAL front end: parser, typed AST, type checking, capability and trust analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The CLI reads a text bundle, and JSON is a specification — hand-rolling one
# here produced a parser that consumed the object it was standing on. The
# library itself has no dependencies; this is behind the feature the binary
# requires.
serde_json = { version = "1", optional = true }

[features]
cli = ["dep:serde_json"]

[[bin]]
name = "valc"
required-features = ["cli"]
