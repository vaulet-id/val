[package]
# The language is VAL; the crate is `valang`, because `val` on crates.io belongs
# to somebody else. Named at the start rather than at the first publish, so no
# rename lands on people who already depend on it.
name = "valang"
description = "The VAL front end: parser, typed AST, type checking, capability and trust analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# A catalogue and a text bundle are both documents this crate reads, and JSON is
# a specification — hand-rolling one here produced a parser that consumed the
# object it was standing on.
serde_json = "1"
# How wide a character is on a terminal, which is a specification and not a
# guess: a Thai tone mark takes no columns and a CJK character takes two, so a
# caret placed by counting characters lands in the wrong place on half of what
# these files say.
unicode-width = "0.2"

[dev-dependencies]
unicode-width = "0.2"
# The back end, for the tests that read a capability report. What an application
# does to the person comes from the compiled module, so a test that asserts it
# has to compile one. A dev-dependency, so nothing that ships carries it — and
# the cycle it makes is one Cargo allows for exactly this.
valang-wasm = { path = "../valang-wasm" }

